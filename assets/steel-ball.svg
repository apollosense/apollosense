<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="A spinning steel ball">
  <defs>
    <radialGradient id="steel" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f1f8ec"/>
      <stop offset="0.25" stop-color="#9cc3a6"/>
      <stop offset="0.65" stop-color="#2f5d46"/>
      <stop offset="1" stop-color="#0b2016"/>
    </radialGradient>
    <radialGradient id="shade" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#d4a94a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d4a94a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="120" cy="120" r="62"/></clipPath>
    <path id="groove" d="M120 120 C 128 92, 160 84, 184 104" fill="none" stroke="#0b2016" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  </defs>

  <circle cx="120" cy="120" r="112" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- golden spiral, drifting slowly behind the ball -->
  <g opacity="0.55">
    <path transform="translate(22 46) scale(1.36)" fill="none" stroke="#d4a94a" stroke-width="1.6" stroke-linecap="round"
          d="M0 89 A89 89 0 0 1 89 0 A55 55 0 0 1 144 55 A34 34 0 0 1 110 89 A21 21 0 0 1 89 68 A13 13 0 0 1 102 55 A8 8 0 0 1 110 63 A5 5 0 0 1 105 68 A3 3 0 0 1 102 65"/>
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="-360 120 120" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- rotation energy rings -->
  <g fill="none" stroke="#d4a94a" stroke-linecap="round">
    <circle cx="120" cy="120" r="80" stroke-width="3" stroke-dasharray="70 56 24 100">
      <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="120" r="94" stroke-width="1.5" stroke-dasharray="40 110 12 133" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the ball -->
  <circle cx="120" cy="120" r="62" fill="url(#steel)"/>
  <g clip-path="url(#ball)">
    <g>
      <use href="#groove"/>
      <use href="#groove" transform="rotate(60 120 120)"/>
      <use href="#groove" transform="rotate(120 120 120)"/>
      <use href="#groove" transform="rotate(180 120 120)"/>
      <use href="#groove" transform="rotate(240 120 120)"/>
      <use href="#groove" transform="rotate(300 120 120)"/>
      <circle cx="120" cy="120" r="7" fill="#0b2016" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="0.9s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="120" cy="120" r="62" fill="url(#shade)"/>
  <circle cx="120" cy="120" r="62" fill="none" stroke="#d4a94a" stroke-width="1.5" opacity="0.8"/>
</svg>
