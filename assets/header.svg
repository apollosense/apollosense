<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" role="img" aria-label="nyo hô — profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2016"/>
      <stop offset="0.6" stop-color="#123524"/>
      <stop offset="1" stop-color="#1c4a33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e3a1"/>
      <stop offset="0.5" stop-color="#d4a94a"/>
      <stop offset="1" stop-color="#a87b24"/>
    </linearGradient>
    <radialGradient id="steel" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f1f8ec"/>
      <stop offset="0.25" stop-color="#9cc3a6"/>
      <stop offset="0.65" stop-color="#2f5d46"/>
      <stop offset="1" stop-color="#0b2016"/>
    </radialGradient>
    <radialGradient id="shade" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <clipPath id="card"><rect width="880" height="260" rx="18"/></clipPath>
    <clipPath id="ball"><circle cx="720" cy="130" r="56"/></clipPath>
    <path id="groove" d="M720 130 C 727 105, 756 98, 778 116" fill="none" stroke="#0b2016" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
    <path id="star" d="M0 -9 L2.6 -2.8 L9 -2.8 L3.8 1.4 L5.6 8 L0 4.2 L-5.6 8 L-3.8 1.4 L-9 -2.8 L-2.6 -2.8 Z"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="260" fill="url(#bg)"/>

    <!-- golden rectangle + spiral -->
    <g transform="translate(500 12) scale(2.62)" fill="none" stroke="#d4a94a" stroke-linecap="round">
      <g stroke-width="0.35" opacity="0.28">
        <rect x="0" y="0" width="144" height="89"/>
        <path d="M89 0 V89 M89 55 H144 M110 55 V89 M89 68 H110 M102 55 V68 M102 63 H110"/>
      </g>
      <path stroke-width="0.9" opacity="0.8" stroke-dasharray="330" stroke-dashoffset="330"
            d="M0 89 A89 89 0 0 1 89 0 A55 55 0 0 1 144 55 A34 34 0 0 1 110 89 A21 21 0 0 1 89 68 A13 13 0 0 1 102 55 A8 8 0 0 1 110 63 A5 5 0 0 1 105 68 A3 3 0 0 1 102 65">
        <animate attributeName="stroke-dashoffset" values="330;0;0;330" keyTimes="0;0.45;0.85;1" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- menacing -->
    <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-weight="900" fill="#d4a94a">
      <text x="604" y="62" font-size="30" opacity="0.5" transform="rotate(-12 604 62)">ゴ<animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.2s" repeatCount="indefinite"/></text>
      <text x="820" y="92" font-size="24" opacity="0.4" transform="rotate(10 820 92)">ゴ<animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></text>
      <text x="806" y="218" font-size="34" opacity="0.4" transform="rotate(-8 806 218)">ゴ<animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.2s" begin="1s" repeatCount="indefinite"/></text>
      <text x="612" y="226" font-size="20" opacity="0.4" transform="rotate(14 612 226)">ゴ<animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.2s" begin="1.5s" repeatCount="indefinite"/></text>
    </g>

    <!-- steel ball -->
    <g fill="none" stroke="#d4a94a" stroke-linecap="round">
      <circle cx="720" cy="130" r="72" stroke-width="3" stroke-dasharray="64 50 22 90">
        <animateTransform attributeName="transform" type="rotate" from="0 720 130" to="360 720 130" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="130" r="85" stroke-width="1.4" stroke-dasharray="36 100 12 119" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="360 720 130" to="0 720 130" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="720" cy="130" r="56" fill="url(#steel)"/>
    <g clip-path="url(#ball)">
      <g>
        <use href="#groove"/>
        <use href="#groove" transform="rotate(60 720 130)"/>
        <use href="#groove" transform="rotate(120 720 130)"/>
        <use href="#groove" transform="rotate(180 720 130)"/>
        <use href="#groove" transform="rotate(240 720 130)"/>
        <use href="#groove" transform="rotate(300 720 130)"/>
        <circle cx="720" cy="130" r="6" fill="#0b2016" opacity="0.8"/>
        <animateTransform attributeName="transform" type="rotate" from="0 720 130" to="360 720 130" dur="0.9s" repeatCount="indefinite"/>
      </g>
    </g>
    <circle cx="720" cy="130" r="56" fill="url(#shade)"/>
    <circle cx="720" cy="130" r="56" fill="none" stroke="#d4a94a" stroke-width="1.4" opacity="0.8"/>

    <!-- title -->
    <g fill="#d4a94a">
      <use href="#star" transform="translate(60 62)"/>
      <use href="#star" transform="translate(84 62) scale(0.7)" opacity="0.7"/>
      <use href="#star" transform="translate(102 62) scale(0.5)" opacity="0.5"/>
    </g>
    <text x="124" y="67" font-family="Georgia,'Times New Roman',serif" font-size="14" letter-spacing="5" fill="#9cc3a6">STEEL BALL RUN</text>
    <text x="50" y="140" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="700" font-size="60" fill="url(#gold)">nyo hô</text>
    <rect x="52" y="160" width="0" height="3" rx="1.5" fill="url(#gold)">
      <animate attributeName="width" values="0;380;380" keyTimes="0;0.25;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="52" y="196" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#e9f0dc">vibecoder · learning html and stuff related to that</text>
    <text x="52" y="226" font-family="'Courier New',monospace" font-size="13" fill="#9cc3a6">lesson 5 · the shortest path was a detour</text>

    <rect x="1" y="1" width="878" height="258" rx="17" fill="none" stroke="#d4a94a" stroke-opacity="0.45" stroke-width="2"/>
  </g>
</svg>
